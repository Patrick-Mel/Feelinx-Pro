version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: feelinx_postgres
    restart: always
    environment:
      POSTGRES_DB: feelinx_db
      POSTGRES_USER: feelinx_user
      POSTGRES_PASSWORD: feelinx_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: feelinx_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feelinx_backend
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME=feelinx_db
      - DB_USER=feelinx_user
      - DB_PASSWORD=feelinx_secure_pass_2026
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SMS_PROVIDER=console
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feelinx_celery_worker
    restart: always
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      - DEBUG=True
      - DB_NAME=feelinx_db
      - DB_USER=feelinx_user
      - DB_PASSWORD=feelinx_secure_pass_2026
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feelinx_celery_beat
    restart: always
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - DB_NAME=feelinx_db
      - DB_USER=feelinx_user
      - DB_PASSWORD=feelinx_secure_pass_2026
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  media_data:
