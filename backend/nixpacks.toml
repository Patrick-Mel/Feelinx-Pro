[providers]
python = "3.12"

[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "libpqxx"]

[phases.install]
cmds = ["python3 -m pip install -r requirements.txt"]

[phases.build]
cmds = ["python3 manage.py collectstatic --noinput"]

[start]
cmd = "python3 manage.py migrate && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
