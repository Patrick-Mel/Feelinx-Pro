name: feelinx
description: "Feelinx - Application de rencontre et de mise en relation sociale pour l'Afrique"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing & Navigation
  go_router: ^13.2.0

  # Localization
  easy_localization: ^3.0.7

  # Networking & WebSockets
  dio: ^5.4.1
  web_socket_channel: ^2.4.5

  # Local Storage & Security
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_native_splash: ^2.4.0

  # Models & Functional Programming
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # UI, Images & Design System
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1

  # Hardware & Permissions
  permission_handler: ^11.3.0
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  image_cropper: ^8.0.0

  flutter_image_compress: ^2.1.8

  # Push Notifications & Haptics
  onesignal_flutter: ^5.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app-icon.png"
  adaptive_icon_background: "assets/branding/app-icon-adaptive-background.png"
  adaptive_icon_foreground: "assets/branding/app-icon-adaptive-foreground.png"
  web:
    generate: true
    image_path: "assets/branding/app-icon.png"
    background_color: "#0F0D13"
    theme_color: "#FF4E64"

flutter_native_splash:
  color: "#0F0D13"
  color_dark: "#0F0D13"
  image: "assets/branding/logo-symbol.png"
  android_12:
    image: "assets/branding/logo-symbol.png"
    icon_background_color: "#0F0D13"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/icons/
    - assets/images/
    - assets/branding/
