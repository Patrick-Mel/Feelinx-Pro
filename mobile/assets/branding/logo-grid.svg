<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="gridSymbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4E64" />
      <stop offset="100%" stop-color="#6C4AB6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="800" fill="#0F0D13" />

  <!-- Grid Blueprint Lines -->
  <g stroke="#2D283A" stroke-width="1" stroke-dasharray="4,4">
    <!-- Grid Cells 50px -->
    <path d="M 0,100 H 800 M 0,200 H 800 M 0,300 H 800 M 0,400 H 800 M 0,500 H 800 M 0,600 H 800 M 0,700 H 800" />
    <path d="M 100,0 V 800 M 200,0 V 800 M 300,0 V 800 M 400,0 V 800 M 500,0 V 800 M 600,0 V 800 M 700,0 V 800" />
  </g>

  <!-- Protection Zone (Clearance Box) -->
  <rect x="100" y="100" width="600" height="600" fill="none" stroke="#FF4E64" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <text x="120" y="130" font-family="sans-serif" font-size="14" fill="#FF4E64">Zone de protection x = 100px</text>

  <!-- Construction Circles & Tangents -->
  <circle cx="344" cy="244" r="144" fill="none" stroke="#6C4AB6" stroke-width="1.5" opacity="0.8" />
  <circle cx="344" cy="244" r="80" fill="none" stroke="#F4B740" stroke-width="1.5" opacity="0.8" />
  <circle cx="488" cy="428" r="144" fill="none" stroke="#6C4AB6" stroke-width="1.5" opacity="0.8" />
  <circle cx="488" cy="428" r="80" fill="none" stroke="#F4B740" stroke-width="1.5" opacity="0.8" />

  <!-- Actual Symbol Overlay -->
  <g transform="translate(144, 144) scale(1)">
    <path fill="url(#gridSymbolGrad)" opacity="0.85" d="M 116,420 V 152 C 116,108 152,72 196,72 H 380 C 397.67,72 412,86.33 412,104 C 412,121.67 397.67,136 380,136 H 216 C 196.12,136 180,152.12 180,172 V 420 C 180,437.67 165.67,452 148,452 C 130.33,452 116,437.67 116,420 Z" />
    <path fill="url(#gridSymbolGrad)" opacity="0.85" d="M 180,248 H 340 C 362.09,248 380,265.91 380,288 C 380,310.09 362.09,328 340,328 H 260 C 242.33,328 228,342.33 228,360 C 228,377.67 242.33,392 260,392 H 340 C 397.44,392 444,345.44 444,288 C 444,230.56 397.44,184 340,184 H 180 V 248 Z" />
  </g>

  <!-- Key Dimension Markers -->
  <line x1="260" y1="216" x2="524" y2="216" stroke="#FFFFFF" stroke-width="2" />
  <text x="390" y="206" font-family="sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">R1 = 144px (Rayon d'arc majeur)</text>
</svg>
